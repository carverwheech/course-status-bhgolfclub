name: Update course status feed

on:
  schedule:
    - cron: '*/15 4-20 * * *'   # 04:00–20:59 UTC (05:00–21:59 BST); GitHub throttles actual runs
  workflow_dispatch: {}          # lets you trigger it manually from the Actions tab

concurrency:
  group: course-status-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape_status.py

      - name: Run diary scraper
        run: python scrape_diary.py

      - name: Commit updated feed if changed
        run: |
          git config user.name "course-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add course-status.xml course-status.svg club-diary.xml club-diary.json
          git diff --staged --quiet || git commit -m "Update course status feed"
          git push
