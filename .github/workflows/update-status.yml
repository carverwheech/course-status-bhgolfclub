name: Update course status feed

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape_status.py

      - name: Commit updated feed if changed
        run: |
          git config user.name "course-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add course-status.xml
          git diff --staged --quiet || git commit -m "Update course status feed"
          git push
